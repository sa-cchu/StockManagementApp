<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">

	<h1 th:text="${relation.relationId == null} ? '連携追加' : '連携編集'"></h1>

	<div th:if="${errorMessage}" class="alert alert-danger">
		<span th:text="${errorMessage}"></span>
	</div>

	<form th:action="@{/relation/save}" th:object="${relation}" method="post">

		<input type="hidden" th:if="*{relationId != null}" th:field="*{relationId}" />

		<div class="mb-3">
			<label for="shop" class="form-label">店舗名 <span style="color:red">*</span></label>
			<select id="shop" th:field="*{shop.shopId}" class="form-select">
				<option value="">-- 店舗を選択してください --</option>
				<option th:each="shop : ${shop}" th:value="${shop.shopId}" th:text="${shop.shopName}">
				</option>
			</select>
		</div>

		<div class="mb-3">
			<label for="warehouse" class="form-label">倉庫名 <span style="color:red">*</span></label>
			<select id="warehouse" th:field="*{warehouse.warehouseId}" class="form-select">
				<option value="">-- 倉庫を選択してください --</option>
				<option th:each="warehouse : ${warehouse}" th:value="${warehouse.warehouseId}" th:text="${warehouse.warehouseName}">
				</option>
			</select>
		</div>

		<div class="mt-4">
			<button type="submit" class="btn btn-primary" th:text="${relation.relationId == null} ? '追加' : '保存'"></button>
			<a th:href="@{/relation}" class="btn btn-secondary">一覧に戻る</a>
		</div>

		
	</form>

</div>

</html>
