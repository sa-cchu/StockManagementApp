<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{layout :: layout}">

<div th:fragment="content">

    <h1>店舗在庫編集</h1>

    <form th:action="@{/shop-stock/edit/{shopStockId}(shopStockId=${shopStockId})}"
        th:object="${shopStockFormDto}" method="post">
        <div class="mb-3">
            <label class="form-label">商品名</label>
            <input type="text" class="form-control" th:value="${goodsName}" readonly>
        </div>

        <div class="mb-3">
            <label for="quantity" class="form-label">在庫数</label>
            <input th:field="*{quantity}" type="number" class="form-control" id="quantity">
            <div class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
        </div>

        <button type="submit" class="btn btn-primary">更新</button>
        <a th:href="@{/shop-stock}" class="btn btn-secondary">戻る</a>
    </form>

</div>

</html>
