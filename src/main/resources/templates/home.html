<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">
	<div class="mb-4">
		<h1 class="h3 text-gray-800 font-weight-bold">
			<i class="fas fa-chart-bar mr-2 text-primary"></i>在庫管理Webアプリ
		</h1>
	</div>

	<div class="container-fluid px-0" sec:authorize="hasRole('SHOP')">
		<div class="row">

			<div class="col-xl-6 col-lg-6 mb-4">
				<div class="card shadow border-left-primary h-100">
					<div class="card-header py-3 bg-white">
						<h6 class="m-0 font-weight-bold text-primary">
							<i class="fas fa-award mr-1"></i>
							<span th:text="${belongName}">自店舗</span> 売れ筋TOP5
						</h6>
					</div>
					<div class="card-body p-0">
						<div class="table-responsive">
							<table class="table table-hover mb-0">
								<thead class="thead-light">
									<tr>
										<th class="text-center" style="width: 25%">順位</th>
										<th style="width: 50%">商品名</th>
										<th class="text-right" style="width: 25%">出荷数</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="i : ${#numbers.sequence(0, 4)}">
										<td class="text-center align-middle">
											<span th:if="${i == 0}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #f6c23e;">1位</span>
											<span th:if="${i == 1}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #adb5bd;">2位</span>
											<span th:if="${i == 2}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #cd7f32;">3位</span>
											<span th:if="${i == 3}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #36b9cc;">4位</span>
											<span th:if="${i == 4}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #1cc88a;">5位</span>
										</td>

										<td class="align-middle">
											<span th:if="${shopRanking != null and shopRanking.size() > i}"
												th:text="${shopRanking[i].goodsName}"
												class="font-weight-bold text-dark">商品名</span>
											<span th:unless="${shopRanking != null and shopRanking.size() > i}"
												class="text-muted small">---</span>
										</td>

										<td class="text-right align-middle">
											<div th:if="${shopRanking != null and shopRanking.size() > i}"
												class="font-weight-bold">
												<span
													th:text="${#numbers.formatInteger(shopRanking[i].goodsAmount, 1, 'COMMA')}"
													class="text-primary">0</span>
												<small class="text-muted ml-1">個</small>
											</div>
											<span th:unless="${shopRanking != null and shopRanking.size() > i}"
												class="text-muted small">0</span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>

			<div class="col-xl-6 col-lg-6 mb-4">
				<div class="card shadow border-left-secondary h-100">
					<div class="card-header py-3 bg-white">
						<h6 class="m-0 font-weight-bold text-secondary">
							<i class="fas fa-chart-line mr-1"></i> 全店舗 総合TOP5
						</h6>
					</div>
					<div class="card-body p-0">
						<div class="table-responsive">
							<table class="table table-hover mb-0">
								<thead class="thead-light">
									<tr>
										<th class="text-center" style="width: 25%">順位</th>
										<th style="width: 50%">商品名</th>
										<th class="text-right" style="width: 25%">出荷数</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="i : ${#numbers.sequence(0, 4)}">
										<td class="text-center align-middle">
											<span th:if="${i == 0}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #f6c23e;">1位</span>
											<span th:if="${i == 1}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #adb5bd;">2位</span>
											<span th:if="${i == 2}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #cd7f32;">3位</span>
											<span th:if="${i == 3}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #36b9cc;">4位</span>
											<span th:if="${i == 4}" class="badge p-2 text-white shadow-sm"
												style="width: 55px; background-color: #1cc88a;">5位</span>
										</td>
										<td class="align-middle">
											<span th:if="${allRanking != null and allRanking.size() > i}"
												th:text="${allRanking[i].goodsName}"
												class="font-weight-bold text-dark">商品名</span>
											<span th:unless="${allRanking != null and allRanking.size() > i}"
												class="text-muted small">---</span>
										</td>
										<td class="text-right align-middle font-weight-bold">
											<div th:if="${allRanking != null and allRanking.size() > i}">
												<span
													th:text="${#numbers.formatInteger(allRanking[i].goodsAmount, 1, 'COMMA')}">0</span>
												<small class="text-muted ml-1">個</small>
											</div>
											<span th:unless="${allRanking != null and allRanking.size() > i}"
												class="text-muted small">0</span>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>

		</div>
	</div>
</div>

</html>
