<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:replace="~{layout :: layout}">

<div th:fragment="content">
	<h1>ユーザー管理</h1>
	<div class="mb-3 d-flex justify-content-between align-items-center">
		<a th:href="@{/user/new}" class="btn btn-primary mb-3">新規追加</a>

		<form th:action="@{/user}" method="get" class="d-inline-flex align-items-center">
			<label for="authorityId" class="me-2 mb-0" style="white-space: nowrap;">権限:</label>
			<select name="authorityId" id="authorityId" class="form-select" onchange="this.form.submit()">
				<option value="0">すべて</option>
				<option th:each="authority : ${authorities}" th:value="${authority.authorityId}"
					th:text="${authority.authorityName}" th:selected="${authority.authorityId == selectedId}">
				</option>
			</select>
		</form>
	</div>

	<table class="table table-striped">
		<thead>
			<tr>
				<th>名前</th>
				<th>性別</th>
				<th>権限</th>
				<th>所属</th>
				<th>アクション</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="u : ${userList}">
				<td th:text="${u.userName}"></td>

				<td th:text="${u.userGender}"></td>

				<td th:text="${u.authority != null ? u.authority.authorityName : ''}"></td>

				<td>
					<span th:if="${u.shop != null}" th:text="${u.shop.shopName}"></span>
					<span th:if="${u.warehouse != null}" th:text="${u.warehouse.warehouseName}"></span>
				</td>

				<td>
					<a th:href="@{/user/edit/{userId}(userId=${u.userId})}" class="btn btn-sm btn-warning">編集</a>
					<form th:action="@{/user/delete/{userId}(userId=${u.userId})}" method="post" style="display:inline;"
						onsubmit="return confirm('本当に削除しますか？');">
						<button type="submit" class="btn btn-sm btn-danger">削除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</div>

</html>
