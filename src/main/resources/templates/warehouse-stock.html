<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">
    <h1>倉庫在庫一覧</h1>

    <div class="mb-3 d-flex justify-content-end align-items-center">
        <form th:action="@{/warehouse-stock}" method="get" class="d-inline-flex align-items-center">
            <label for="categoryId" class="me-2 mb-0" style="white-space: nowrap;">カテゴリ:</label>
            <select name="categoryId" id="categoryId" class="form-select" onchange="this.form.submit()">
                <option value="0">すべて</option>
                <option th:each="category : ${categories}" th:value="${category.categoryId}"
                    th:text="${category.categoryName}" th:selected="${category.categoryId == selectedId}">
                </option>
            </select>
        </form>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>倉庫名</th>
                <th>カテゴリ</th>
                <th>商品名</th>
                <th>在庫数</th>
                <th>アクション</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="stock : ${warehouseStocks}">
                <td th:text="${stock.warehouseName}"></td>
                <td th:text="${stock.categoryName}"></td>
                <td th:text="${stock.goodsName}"></td>
                <td th:text="${stock.warehouseStockQuantity}"></td>
                <td>
                    <a th:href="@{/warehouse-stock/edit/{id}(id=${stock.warehouseStockId})}"
                        class="btn btn-sm btn-warning">編集</a>
                </td>
            </tr>
        </tbody>
    </table>

</html>
