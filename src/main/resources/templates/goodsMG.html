<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">

    <h1>商品管理</h1>

    <div class="mb-3 d-flex justify-content-between align-items-center">
        <a th:href="@{/goods/new}" class="btn btn-primary">新商品追加</a>

        <form th:action="@{/goods}" method="get" class="d-inline-flex align-items-center">
            <label for="categoryId" class="me-2 mb-0" style="white-space: nowrap;">カテゴリー:</label>
            <select name="categoryId" id="categoryId" class="form-select" onchange="this.form.submit()">
                <option value="0">すべて</option>
                <option th:each="cat : ${categories}" 
                        th:value="${cat.categoryId}" 
                        th:text="${cat.categoryName}"
                        th:selected="${cat.categoryId == selectedId}">
                </option>
            </select>
        </form>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>商品名</th>
                <th>カテゴリー</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="goods : ${goodsList}">
                <td th:text="${goods.goodsName}"></td>
                <td th:text="${goods.category.categoryName}"></td>
                <td>
                    <form th:action="@{/goods/delete/{goodsId}(goodsId=${goods.goodsId})}" method="post"
                        style="display:inline;" onsubmit="return confirm('本当に削除しますか？');">
                        <button type="submit" class="btn btn-sm btn-danger">
                            削除
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</div>
</html>
