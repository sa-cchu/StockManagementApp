<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<head>
    <meta charset="UTF-8">
    <title>受注管理</title>
</head>

<body>
    <div th:fragment="content">
        <h1 class="mb-4">受注管理</h1>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="mb-3">
            <form id="filterForm" th:action="@{/warehouse-order/list}" method="get" class="row g-3 align-items-end">
                <div class="col-md-auto">
                    <label class="form-label">期間:</label>
                    <div class="input-group">
                        <input type="date" name="startDate" id="startDate" class="form-control" th:value="${startDate}">
                        <span class="input-group-text">〜</span>
                        <input type="date" name="endDate" id="endDate" class="form-control" th:value="${endDate}">
                    </div>
                </div>

                <div class="col-md-auto">
                    <label for="status" class="form-label">ステータス:</label>
                    <select name="status" id="status" class="form-select">
                        <option value="">すべて</option>
                        <option value="準備中" th:selected="${selectedStatus == '準備中'}">準備中</option>
                        <option value="発送済み" th:selected="${selectedStatus == '発送済み'}">発送済み</option>
                    </select>
                </div>

                <!-- アクションボタン（左寄せ: 絞り込み・クリア） -->
                <div class="col-md-auto d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary">絞り込み</button>
                    <!-- クリアボタン -->
                    <a th:href="@{/warehouse-order/list}" class="btn btn-secondary">クリア</a>
                </div>

                <!-- エクスポートボタン（右寄せ: CSV・PDF） -->
                <div class="col-md-auto ms-auto d-flex align-items-end gap-2">
                    <!-- スクリプトでフォームのactionを書き換えてCSV出力 -->
                    <button type="button" class="btn btn-success" onclick="exportFile('csv')">CSV出力</button>
                    <!-- スクリプトでフォームのactionを書き換えてPDF出力 -->
                    <button type="button" class="btn btn-danger" onclick="exportFile('pdf')">PDF出力</button>
                </div>
            </form>
        </div>

        <script>
            function exportFile(type) {
                const form = document.getElementById('filterForm');
                const originalAction = form.action;
                // JSでアクション先を動的に切り替える（/warehouse-order/list/csv または pdf）
                form.action = '/warehouse-order/list/' + type;
                form.submit();
                // すぐに元の状態に戻す（次の操作で困らないように）
                form.action = originalAction;
            }
        </script>

        <table class="table table-striped align-middle" th:if="${!orderHistoryList.isEmpty()}">
            <thead>
                <tr>
                    <th>発注ID</th>
                    <th>発注元店舗</th>
                    <th>商品名</th>
                    <th>発注個数</th>
                    <th>ステータス</th>
                    <th>発注日時</th>
                    <th>更新日時</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orderHistoryList}">
                    <td th:text="${order.orderId}"></td>
                    <td th:text="${order.shopName}"></td>
                    <td th:text="${order.goodsName}"></td>
                    <td th:text="${order.orderAmount} + '個'"></td>
                    <td>
                        <span th:if="${order.orderStatus == '準備中'}" class="badge bg-warning text-dark">準備中</span>
                        <span th:if="${order.orderStatus == '発送済み'}" class="badge bg-success">発送済み</span>
                    </td>
                    <td th:text="${#temporals.format(order.orderDate, 'yyyy/MM/dd HH:mm')}"></td>
                    <td th:text="${#temporals.format(order.updateDate, 'yyyy/MM/dd HH:mm')}"></td>
                    <td>
                        <form th:if="${order.orderStatus == '準備中'}" th:action="@{/warehouse-order/update-status}"
                            method="post" style="display:inline;">
                            <input type="hidden" name="orderId" th:value="${order.orderId}">
                            <button type="submit" class="btn btn-success btn-sm">発送済みにする</button>
                        </form>
                        <button th:if="${order.orderStatus == '発送済み'}" class="btn btn-secondary btn-sm"
                            disabled>変更済み</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${orderHistoryList.isEmpty()}" class="alert alert-info">
            受注履歴がありません。
        </div>
    </div>
</body>

</html>
