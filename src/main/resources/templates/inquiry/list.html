<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout">

<div th:fragment="content">
	<!-- 中身 -->
	<h1 class="mb-3">お問い合わせ一覧</h1>
	
	<!-- 削除成功メッセージを表示 -->
	<div th:if="${successMessage}" class="successMessage alert alert-success mb-3" role="alert"> 
	    <span th:text="${successMessage}"></span>
	</div>
	<!-- 削除失敗メッセージを表示 -->
	<div th:if="${errorMessage}" class="errorMessage alert alert-danger mb-3" role="alert">
	    <span th:text="${errorMessage}"></span>
	</div>
	
	<div class="d-flex justify-content-between align-items-center mb-3">
		<!-- 管理者権限以外のユーザーでログインしているときだけ表示する -->
		<a th:if="${!isAdmin}" th:href="@{/inquiry/create}" class="btn btn-primary">
			問い合わせを送信
		</a>

		<!-- フィルターエリア：ステータスで並び替えを行う -->
		<form th:action="@{/inquiry/list}" method="get" class="d-flex align-items-center gap-2 ms-auto">
			<strong class="me-2">フィルター</strong>
			
			<!-- ステータスフィルター -->
			<label for="statusFilter">ステータス：</label>
			<select id="statusFilter"
			        name="status"
			        class="form-select w-auto"
			        onchange="this.form.submit()">
				<option value="">すべて</option>
				<option th:each="st : ${statusList}" 
						th:value="${st.statusId}"
						th:text="${st.displayStatusName}" 
						th:selected="${status == st.statusId}">
				</option>
			</select>
		</form>
	</div>

	<!-- お問い合わせ一覧テーブルエリア -->
	<table class="table">
		<thead class="table-info">
			<tr>
				<th>問い合わせ内容</th>
				<th>権限</th>
				<th>所属</th>
				<th>名前</th>
				<th>送信日時</th>
				<th>ステータス</th>
				<th>アクション</th>
			</tr>
		</thead>

		<tbody>
			<tr th:if="${inquiryList == null or #lists.isEmpty(inquiryList)}">
				<td colspan="7" class="text-center text-muted">
					条件に一致するお問い合わせはありません。
				</td>
			</tr>

			<tr th:each="inquiry : ${inquiryList}">

				<!-- 問い合わせ内容（10文字まで） -->
				<td th:text="${#strings.length(inquiry.inquiryDetail) > 10 
					? #strings.substring(inquiry.inquiryDetail,0,10) + '...' 
					: inquiry.inquiryDetail}">
				</td>

				<!-- 権限表示（ゲスト含む） -->
				<td th:text="${inquiry.authorityDisplayName}"></td>
				
				<!-- 所属 -->
				<td th:text="${inquiry.locationName}"></td>

				<!-- 送信者 -->
				<td th:text="${inquiry.userName}"></td>

				<!-- 送信日時 -->
				<td th:text="${#temporals.format(inquiry.inquiryDate,'yyyy/MM/dd HH:mm')}"></td>

				<!-- ステータス -->
				<td th:text="${inquiry.inquiryStatus}"></td>

				<!-- 詳細 -->
				<td>
					<a th:href="@{/inquiry/detail(id=${inquiry.inquiryId})}" class="btn btn-sm btn-info">
						詳細
					</a>
					<form th:action="@{/inquiry/delete(id=${inquiry.inquiryId})}" method="post" style="display:inline;"
						onsubmit="return confirm('本当に削除しますか？');">
						<button type="submit" class="btn btn-sm btn-danger">削除</button>
					</form>
				</td>

			</tr>
		</tbody>
	</table>
</div>

</html>
