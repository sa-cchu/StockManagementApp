<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">

	<h1>連携管理</h1>

	<div class="mb-3 d-flex justify-content-between align-items-center">
		<a th:href="@{/relation/new}" class="btn btn-primary">連携追加</a>

		<form th:action="@{/relation}" method="get" class="d-inline-flex align-items-center">
			<label for="shopId" class="me-2 mb-0" style="white-space: nowrap;">所属店舗:</label>
			<select name="shopId" id="shopId" class="form-select" onchange="this.form.submit()">
				<option value="0" th:selected="${selected == 0 || selected == null}">すべて</option>
				<option th:each="shop : ${shop}" th:value="${shop.shopId}" th:text="${shop.shopName}"
					th:selected="${shop.shopId == selected}"></option>
			</select>
		</form>
	</div>

	<table class="table table-striped">
		<thead>
			<tr>
				<th>店舗名</th>
				<th>倉庫名</th>
				<th></th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="relation : ${relationList}">
				<td th:text="${relation.shop.shopName}"></td>
				<td th:text="${relation.warehouse.warehouseName}"></td>
				<td>
					<form th:action="@{/relation/delete/{id}(id=${relation.relationId})}" method="post"
						style="display:inline;" onsubmit="return confirm('本当に削除しますか？');">
						<button type="submit" class="btn btn-sm btn-danger">
							削除
						</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>

</div>

</html>
