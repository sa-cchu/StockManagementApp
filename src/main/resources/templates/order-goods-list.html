<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">
    <h1>発注商品選択</h1>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="mb-3">
        <form th:action="@{/shop-order/goods-list}" method="get" class="d-flex align-items-center">
            <label for="categoryId" class="me-2">カテゴリで絞り込む:</label>
            <select name="categoryId" id="categoryId" class="form-select w-auto me-2" onchange="this.form.submit()">
                <option value="">すべて</option>
                <option th:each="category : ${categories}" th:value="${category.categoryId}"
                    th:text="${category.categoryName}" th:selected="${category.categoryId == selectedCategoryId}">
                </option>
            </select>
            <noscript>
                <button type="submit" class="btn btn-secondary btn-sm">絞り込み</button>
            </noscript>
        </form>
    </div>

    <table class="table table-striped align-middle">
        <thead>
            <tr>
                <th>商品名</th>
                <th>カテゴリ</th>
                <th>連携先合計在庫</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="target : ${targetGoodsList}">
                <td th:text="${target.goods.goodsName}"></td>
                <td th:text="${target.categoryName}"></td>

                <td>
                    <span th:if="${target.totalStockQuantity > 0}"
                        th:text="'在庫あり (' + ${target.totalStockQuantity} + '個)'" class="text-success fw-bold"></span>
                    <span th:if="${target.totalStockQuantity <= 0}" class="text-danger">在庫なし</span>
                </td>

                <td>
                    <a th:if="${target.totalStockQuantity > 0}"
                        th:href="@{/shop-order/form(goodsId=${target.goods.goodsId})}"
                        class="btn btn-primary btn-sm">発注画面へ</a>

                    <button th:if="${target.totalStockQuantity <= 0}" class="btn btn-secondary btn-sm"
                        disabled>発注不可</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</html>
