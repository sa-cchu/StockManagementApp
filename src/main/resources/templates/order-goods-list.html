<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<h1>発注商品選択</h1>
	</div>

	<div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
		<i class="bi bi-check-circle-fill me-2"></i>
		<span th:text="${successMsg}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
	</div>

	<div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
		<i class="bi bi-exclamation-triangle-fill me-2"></i>
		<span th:text="${errorMsg}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
	</div>

	<div class="card mb-4 border-primary shadow-sm">
		<div class="card-header bg-primary text-white py-2">
			<h6 class="mb-0"><i class="bi bi-file-earmark-excel me-1"></i> Excelから一括発注</h6>
		</div>
		<div class="card-body py-3">
			<form th:action="@{/order/import}" method="post" enctype="multipart/form-data">

				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div class="row g-2">
					<div class="col-md-8">
						<input type="file" name="file" class="form-control form-control-sm" accept=".xlsx, .xls"
							required>
					</div>
					<div class="col-md-4">
						<button type="submit" class="btn btn-primary btn-sm w-100">インポート実行</button>
					</div>
				</div>
			</form>
		</div>
	</div>

	<hr>

	<div class="mb-3">
		<form th:action="@{/shop-order/goods-list}" method="get" class="d-flex align-items-center">
			<label for="categoryId" class="me-2 fw-bold">カテゴリ絞り込み:</label>
			<select name="categoryId" id="categoryId" class="form-select form-select-sm w-auto me-2"
				onchange="this.form.submit()">
				<option value="">すべて</option>
				<option th:each="category : ${categories}" th:value="${category.categoryId}"
					th:text="${category.categoryName}" th:selected="${category.categoryId == selectedCategoryId}">
				</option>
			</select>
			<noscript>
				<button type="submit" class="btn btn-secondary btn-sm">絞り込み</button>
			</noscript>
		</form>
	</div>

	<table class="table table-hover align-middle shadow-sm">
		<thead class="table-light">
			<tr>
				<th>商品名</th>
				<th>カテゴリ</th>
				<th>連携先合計在庫</th>
				<th class="text-center">アクション</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="target : ${targetGoodsList}">
				<td th:text="${target.goods.goodsName}" class="fw-bold"></td>
				<td th:text="${target.categoryName}"></td>

				<td>
					<span th:if="${target.totalStockQuantity > 0}"
						th:text="'在庫あり (' + ${target.totalStockQuantity} + '個)'"
						class="badge bg-success-subtle text-success border border-success"></span>
					<span th:if="${target.totalStockQuantity <= 0}"
						class="badge bg-danger-subtle text-danger border border-danger">在庫なし</span>
				</td>

				<td class="text-center">
					<a th:if="${target.totalStockQuantity > 0}"
						th:href="@{/shop-order/form(goodsId=${target.goods.goodsId})}"
						class="btn btn-outline-primary btn-sm">個別発注へ</a>

					<button th:if="${target.totalStockQuantity <= 0}" class="btn btn-secondary btn-sm"
						disabled>発注不可</button>
				</td>
			</tr>
		</tbody>
	</table>
</div>

</html>
