<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout}">

<div th:fragment="content">

	<h1 th:text="${goods.goodsId == null} ? '新規商品追加' : '商品編集'"></h1>

	<div th:if="${errorMessage}" class="alert alert-danger">
		<span th:text="${errorMessage}"></span>
	</div>

	<form th:action="@{/goods/save}" th:object="${goods}" method="post">

		<input type="hidden" th:if="*{goodsId != null}" th:field="*{goodsId}" />

		<div class="mb-3">
			<label for="goodsName" class="form-label">商品名 <span style="color:red">*</span></label>
			<input type="text" id="goodsName" th:field="*{goodsName}" class="form-control" required maxlength="255">
		</div>

		<div class="mb-3">
			<label for="category" class="form-label">カテゴリー <span style="color:red">*</span></label>
			<select id="category" th:field="*{category.categoryId}" class="form-select" required>
				<option value="">-- カテゴリーを選択してください --</option>
				<option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryName}">
				</option>
			</select>
		</div>

		<div class="mt-4">
			<button type="submit" class="btn btn-primary" th:text="${goods.goodsId == null} ? '追加' : '保存'"></button>
			<a th:href="@{/goods}" class="btn btn-secondary">一覧に戻る</a>
		</div>

	</form>

</div>

</html>
