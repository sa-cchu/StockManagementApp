<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:replace="layout :: layout">

<div th:fragment="content">

	<h1>倉庫管理</h1>

	<!-- 新規追加ボタン -->
	<a th:href="@{/warehouse/new}" class="btn btn-primary mb-3">新規倉庫追加</a>

	<table class="table table-striped">

		<thead>
			<tr>
				<th>倉庫名</th>
				<th>倉庫住所</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="warehouse : ${warehouses}">
				<td th:text="${warehouse.warehouseName}"></td>
				<td th:text="${warehouse.warehouseAddress}"></td>
				<td>
					<!-- 編集ボタン -->
					<a th:href="@{/warehouse/edit/{warehouseId}(warehouseId=${warehouse.warehouseId})}"
						class="btn btn-sm btn-warning">
						編集
					</a>
				</td>
				<td>
					<!-- 削除ボタン -->
					<form th:action="@{/warehouse/delete/{warehouseId}(warehouseId=${warehouse.warehouseId})}"
						method="post" style="display:inline" onsubmit="return confirm('本当に削除しますか？');">
						<button type="submit" class="btn btn-sm btn-danger">
							削除
						</button>
					</form>

			</tr>
		</tbody>
	</table>

</div>

</html>
